<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dorra - The Luxury of Nature</title>
    <meta name="description" content="Handcrafted copper jewelry with natural gemstones. Made entirely by hand in Egypt." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="dorra-loading" style="position:fixed;inset:0;background:#f5efe3;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity .6s ease;">
      <div style="text-align:center;color:#1a120a;">
        <div style="font-family:Georgia,serif;font-size:42px;font-weight:300;letter-spacing:.06em;color:#1a120a;margin-bottom:8px;">Dorra</div>
        <div style="width:40px;height:1px;background:rgba(184,145,60,.5);margin:0 auto 12px;"></div>
        <div style="font-family:Georgia,serif;font-size:11px;font-style:italic;color:rgba(26,18,10,.4);letter-spacing:.2em;">The Luxury of Nature</div>
      </div>
    </div>
    <script>
      window.addEventListener('load',function(){
        var el=document.getElementById('dorra-loading');
        if(el){el.style.opacity='0';setTimeout(function(){el.style.display='none';},700);}
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
